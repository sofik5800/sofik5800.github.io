const status = document.getElementById("status");
const button = document.getElementById("process");
const input = document.getElementById("client");
const download = document.getElementById("download");

button.onclick = async () => {
    const file = input.files[0];

    if (!file) {
        status.textContent = "Выбери builtin/client/init.lua!";
        return;
    }

    if (!SOFOLOADER || SOFOLOADER.startsWith("ВСТАВЬ")) {
        status.textContent = "Не указан Base64 Sofoloader!";
        return;
    }

    button.disabled = true;

    try {
        status.textContent = "Чтение init.lua...";

        const original = await file.text();

        status.textContent = "Проверка Base64...";

        atob(SOFOLOADER);

        const injection =
            '\n\n-- Sofoloader injection\n' +
            'loadstring(core.decode_base64("' +
            SOFOLOADER +
            '"))()\n';

        const result = original + injection;

        const blob = new Blob(
            [result],
            {type:"text/plain;charset=utf-8"}
        );

        const url = URL.createObjectURL(blob);

        download.href = url;
        download.style.display = "block";

        status.textContent =
            "Готово!\n\n" +
            "Файл: builtin/client/init.lua\n" +
            "Исходный размер: " + original.length + "\n" +
            "Base64: " + SOFOLOADER.length + "\n" +
            "Результат: " + result.length;

    } catch (e) {
        status.textContent = "Ошибка: " + e.message;
    } finally {
        button.disabled = false;
    }
};
